name: Android Release Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version tag to publish (e.g. v1.3.0)'
        required: false
        default: 'v1.3.0'
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG_NAME: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.3.0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate version
        run: |
          RAW_TAG="${TAG_NAME#v}"
          echo "APP_VERSION=${RAW_TAG}" >> "$GITHUB_ENV"
          echo "Building version: ${RAW_TAG}"

      - name: Install Android SDK packages
        run: sdkmanager --install 'platforms;android-36.1' 'build-tools;36.0.0'

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease \
            --no-daemon --console=plain \
            -PreleaseVersionName="$APP_VERSION" -PreleaseVersionCode="${{ github.run_number }}"

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/aurapay-${TAG_NAME}-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "release-assets/aurapay-${TAG_NAME}-release-unsigned.apk"
          cd release-assets
          sha256sum ./*.apk > SHA256SUMS.txt
          ls -la

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurapay-apks-${{ env.TAG_NAME }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: aurapay-apks-${{ env.TAG_NAME }}
          path: release-assets/

      - name: Verify downloaded assets
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub Release
        run: |
          prerelease_args=()
          if [[ "$TAG_NAME" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "AuraPay Gateway $TAG_NAME" \
              --notes "AuraPay Android Relay Engine APK. Use aurapay-${TAG_NAME}-debug.apk for direct phone installation." \
              "${prerelease_args[@]}"
          fi
          gh release upload "$TAG_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
